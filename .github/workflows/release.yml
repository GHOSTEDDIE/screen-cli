name: CLI release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go test -race ./...
      - run: npm ci --ignore-scripts
      - run: npm test
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sh scripts/build.sh
      - run: npm ci --ignore-scripts
      - run: mkdir -p packages && npm pack --pack-destination packages
      - run: node npm/bin/screen-cli.cjs --version
      - uses: actions/upload-artifact@v4
        with:
          name: screen-cli-release
          path: |
            dist/
            packages/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: screen-cli-release
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* packages/*.tgz --verify-tag --title "screen-cli $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
